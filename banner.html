<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Startup Banner</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    .banner-container {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .banner-container::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 60%;
      height: 150%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      transform: rotate(-15deg);
    }

    .banner-content {
      text-align: center;
      z-index: 1;
      max-width: 900px;
    }

    .icon-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .icon {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: float 3s ease-in-out infinite;
    }

    .icon:nth-child(2) {
      animation-delay: 0.5s;
    }

    .icon:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .main-title {
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 16px 0;
      line-height: 1.2;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
    }

    .subtitle {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      margin: 0 0 16px 0;
      line-height: 1.4;
    }

    .tagline {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.95);
      margin: 0 0 12px 0;
      line-height: 1.5;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 600;
    }

    .description {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.85);
      margin: 0 0 32px 0;
      line-height: 1.6;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-button {
      display: inline-block;
      background: #ffffff;
      color: #667eea;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      border: none;
      cursor: pointer;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      background: #f8f9fa;
    }

    .decorative-dots {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
    }

    .dot:nth-child(1) { top: 20%; left: 10%; animation: pulse 4s ease-in-out infinite; }
    .dot:nth-child(2) { top: 60%; left: 15%; animation: pulse 3s ease-in-out infinite 0.5s; }
    .dot:nth-child(3) { top: 40%; right: 10%; animation: pulse 5s ease-in-out infinite 1s; }
    .dot:nth-child(4) { top: 80%; right: 20%; animation: pulse 3.5s ease-in-out infinite 1.5s; }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.3;
        transform: scale(1);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.5);
      }
    }

    @media (max-width: 768px) {
      .banner-container {
        padding: 24px;
      }

      .main-title {
        font-size: 36px;
      }

      .subtitle {
        font-size: 20px;
      }

      .tagline {
        font-size: 18px;
      }

      .description {
        font-size: 15px;
      }

      .cta-button {
        padding: 14px 36px;
        font-size: 16px;
      }

      .icon {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="banner-container">
   <div class="decorative-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
   </div>
   <div class="banner-content">
    <div class="icon-container">
     <div class="icon">
      📚
     </div>
     <div class="icon">
      ✨
     </div>
     <div class="icon">
      🚀
     </div>
    </div>
    <h1 class="main-title">AssignmentHub</h1>
    <h2 class="subtitle">Smart Assignment Management Platform</h2>
    <p class="tagline">Your Complete Academic Resource Platform</p>
    <p class="description">Access assignments, practical files, lab manuals, and comprehensive notes all in one place.</p><button class="cta-button">Let's Begin</button>
   </div>
  </div>
  <script>
    const defaultConfig = {
      main_title: "AssignmentHub",
      subtitle: "Smart Assignment Management Platform",
      tagline: "Your Complete Academic Resource Platform",
      description: "Access assignments, practical files, lab manuals, and comprehensive notes all in one place.",
      cta_button: "Let's Begin",
      background_gradient_start: "#667eea",
      background_gradient_end: "#764ba2",
      text_color: "#ffffff",
      button_bg_color: "#ffffff",
      button_text_color: "#667eea",
      font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif",
      font_size: 16
    };

    async function onConfigChange(config) {
      const mainTitle = document.querySelector('.main-title');
      const subtitle = document.querySelector('.subtitle');
      const tagline = document.querySelector('.tagline');
      const description = document.querySelector('.description');
      const ctaButton = document.querySelector('.cta-button');
      const bannerContainer = document.querySelector('.banner-container');
      
      if (mainTitle) mainTitle.textContent = config.main_title || defaultConfig.main_title;
      if (subtitle) subtitle.textContent = config.subtitle || defaultConfig.subtitle;
      if (tagline) tagline.textContent = config.tagline || defaultConfig.tagline;
      if (description) description.textContent = config.description || defaultConfig.description;
      if (ctaButton) ctaButton.textContent = config.cta_button || defaultConfig.cta_button;
      
      const bgStart = config.background_gradient_start || defaultConfig.background_gradient_start;
      const bgEnd = config.background_gradient_end || defaultConfig.background_gradient_end;
      if (bannerContainer) {
        bannerContainer.style.background = `linear-gradient(135deg, ${bgStart} 0%, ${bgEnd} 100%)`;
      }
      
      const textColor = config.text_color || defaultConfig.text_color;
      if (mainTitle) mainTitle.style.color = textColor;
      if (subtitle) subtitle.style.color = `${textColor}f2`;
      if (tagline) tagline.style.color = `${textColor}d9`;
      
      const buttonBg = config.button_bg_color || defaultConfig.button_bg_color;
      const buttonText = config.button_text_color || defaultConfig.button_text_color;
      if (ctaButton) {
        ctaButton.style.background = buttonBg;
        ctaButton.style.color = buttonText;
      }
      
      const fontFamily = config.font_family || defaultConfig.font_family;
      document.body.style.fontFamily = fontFamily;
      
      const baseSize = config.font_size || defaultConfig.font_size;
      if (mainTitle) mainTitle.style.fontSize = `${baseSize * 3.5}px`;
      if (subtitle) subtitle.style.fontSize = `${baseSize * 1.75}px`;
      if (tagline) tagline.style.fontSize = `${baseSize * 1.5}px`;
      if (description) description.style.fontSize = `${baseSize * 1.125}px`;
      if (ctaButton) ctaButton.style.fontSize = `${baseSize * 1.125}px`;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_gradient_start || defaultConfig.background_gradient_start,
            set: (value) => {
              if (window.elementSdk) {
                window.elementSdk.setConfig({ background_gradient_start: value });
              }
            }
          },
          {
            get: () => config.background_gradient_end || defaultConfig.background_gradient_end,
            set: (value) => {
              if (window.elementSdk) {
                window.elementSdk.setConfig({ background_gradient_end: value });
              }
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              if (window.elementSdk) {
                window.elementSdk.setConfig({ text_color: value });
              }
            }
          },
          {
            get: () => config.button_bg_color || defaultConfig.button_bg_color,
            set: (value) => {
              if (window.elementSdk) {
                window.elementSdk.setConfig({ button_bg_color: value });
              }
            }
          },
          {
            get: () => config.button_text_color || defaultConfig.button_text_color,
            set: (value) => {
              if (window.elementSdk) {
                window.elementSdk.setConfig({ button_text_color: value });
              }
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            if (window.elementSdk) {
              window.elementSdk.setConfig({ font_family: value });
            }
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            if (window.elementSdk) {
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["main_title", config.main_title || defaultConfig.main_title],
        ["subtitle", config.subtitle || defaultConfig.subtitle],
        ["tagline", config.tagline || defaultConfig.tagline],
        ["description", config.description || defaultConfig.description],
        ["cta_button", config.cta_button || defaultConfig.cta_button]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>

</html>
